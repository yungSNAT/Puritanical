version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /tools
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /.github/tools/codacy
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    groups:
      site-patches:
        update-types: [patch, minor]
