name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Run tests
        run: node --test tests/*.js
      - name: Lint shell scripts
        run: bash -n hooks/chisle-statusline.sh && bash -n install.sh
      - name: Installer smoke test
        run: node bin/install.js --list && node bin/install.js --help
      # The required gate for the generated files. rustup installs the
      # toolchain pinned in tools/rust-toolchain.toml.
      - name: Test the tools crate and check the generated files
        if: matrix.node == 22
        working-directory: tools
        run: |
          rustup toolchain install
          cargo test --locked
          for c in rules chart samples readme-art; do target/debug/puritanical-tools "$c" --check; done

  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Test standalone installation and PowerShell status output
        run: node --test --test-name-pattern='standalone Claude hook wiring' tests/test_installer.js
