name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Run tests
        if: matrix.node != 22
        run: node --test tests/*.js
      # tests/test_grade_sandbox.js runs benchmarks/quality/grade.js under
      # bubblewrap; on Node 22 it must run, not skip.
      - name: Install bubblewrap and allow unprivileged user namespaces
        if: matrix.node == 22
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      # Node 22 runs the suite once, with the 100% line-coverage floor.
      - name: Run tests with line coverage
        if: matrix.node == 22
        env:
          GRADE_SANDBOX_REQUIRED: '1'
        run: >-
          node --test --experimental-test-coverage --test-coverage-exclude='tests/**' --test-coverage-lines=100
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=lcov --test-reporter-destination=coverage.lcov
          tests/*.js
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.node == 22
        with:
          name: node-coverage
          path: coverage.lcov
          if-no-files-found: error
      - name: Lint shell scripts
        run: bash -n hooks/puritanical-statusline.sh && bash -n install.sh
      - name: Installer smoke test
        run: node bin/install.js --list && node bin/install.js --help
      # The required gate for the generated files. rustup installs the
      # toolchain pinned in tools/rust-toolchain.toml.
      - name: Test the tools crate and check the generated files
        if: matrix.node == 22
        working-directory: tools
        run: |
          rustup toolchain install
          cargo test --locked
          for c in rules chart samples readme-art; do target/debug/puritanical-tools "$c" --check; done
          npm run --prefix .. check:rules

  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Test standalone installation and PowerShell status output
        run: node --test --test-name-pattern='standalone Claude hook wiring' tests/test_installer.js

  # Branch protection requires a check named coverage.
  coverage:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: node-coverage
      - name: Check the report contains production lines
        run: |
          for source in bin/install.js hooks/puritanical-activate.js pi-extension/index.js .opencode/plugins/puritanical.mjs; do
            grep -Fx "SF:$source" coverage.lcov
          done

  upload:
    needs: coverage
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Authenticate the Codecov upload with OIDC; no stored token.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: node-coverage
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage.lcov
          disable_search: true
          fail_ci_if_error: true

  codacy-coverage:
    needs: coverage
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HAS_CODACY_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN != '' }}
    steps:
      - name: Report missing Codacy configuration
        if: env.HAS_CODACY_TOKEN != 'true'
        run: echo "::notice::Codacy coverage upload needs the repository secret CODACY_PROJECT_TOKEN."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_CODACY_TOKEN == 'true'
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.HAS_CODACY_TOKEN == 'true'
        with:
          name: node-coverage
      - name: Verify the coverage reporter
        if: env.HAS_CODACY_TOKEN == 'true'
        run: |
          curl --proto '=https' --proto-redir '=https' --fail --silent --show-error --location --output reporter.jar https://github.com/codacy/codacy-coverage-reporter/releases/download/14.1.3/codacy-coverage-reporter-assembly.jar
          echo 'c33fb4f6e469c6c221a74c5fe2c251d22302f91a3b7a9a0259386a71bdda62a5  reporter.jar' | sha256sum --check
      - name: Upload line coverage to Codacy
        if: env.HAS_CODACY_TOKEN == 'true'
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        run: java -jar reporter.jar report --commit-uuid "$GITHUB_SHA" -r coverage.lcov --language JavaScript
