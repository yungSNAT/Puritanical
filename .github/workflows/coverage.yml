name: Coverage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Run the Node suite with line coverage
        run: >-
          node --test --experimental-test-coverage --test-coverage-exclude='tests/**' --test-coverage-lines=100
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=lcov --test-reporter-destination=coverage.lcov
          tests/*.js
      - name: Check the report contains production lines
        run: |
          for source in bin/install.js hooks/chisle-activate.js pi-extension/index.js .opencode/plugins/chisle.mjs; do
            grep -Fx "SF:$source" coverage.lcov
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-coverage
          path: coverage.lcov
          if-no-files-found: error

  upload:
    needs: coverage
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Authenticate the Codecov upload with OIDC; no stored token.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: node-coverage
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage.lcov
          disable_search: true
          fail_ci_if_error: true

  codacy-coverage:
    needs: coverage
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HAS_CODACY_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN != '' }}
    steps:
      - name: Report missing Codacy configuration
        if: env.HAS_CODACY_TOKEN != 'true'
        run: echo "::notice::Codacy coverage upload needs the repository secret CODACY_PROJECT_TOKEN."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_CODACY_TOKEN == 'true'
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.HAS_CODACY_TOKEN == 'true'
        with:
          name: node-coverage
      - name: Verify the coverage reporter
        if: env.HAS_CODACY_TOKEN == 'true'
        run: |
          curl --proto '=https' --proto-redir '=https' --fail --silent --show-error --location --output reporter.jar https://github.com/codacy/codacy-coverage-reporter/releases/download/14.1.3/codacy-coverage-reporter-assembly.jar
          echo 'c33fb4f6e469c6c221a74c5fe2c251d22302f91a3b7a9a0259386a71bdda62a5  reporter.jar' | sha256sum --check
      - name: Upload line coverage to Codacy
        if: env.HAS_CODACY_TOKEN == 'true'
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        run: java -jar reporter.jar report --commit-uuid "$GITHUB_SHA" -r coverage.lcov --language JavaScript
