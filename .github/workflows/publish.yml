name: GitHub release

# Puritanical ships from its own tagged source on GitHub.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: node --test tests/*.js
      # rustup installs the toolchain pinned in tools/rust-toolchain.toml.
      - name: Check the generated files
        working-directory: tools
        run: |
          rustup toolchain install
          for c in rules chart readme-art; do cargo run --quiet --locked -- "$c" --check; done

  release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # Create the release for an existing tag.
    steps:
      - name: Publish the verified source tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq '.sha')
          if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
            echo "::error::The tag has moved since its tests ran."
            exit 1
          fi
          if [[ "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" == false ]]; then
            echo "The verified tag already has a published release."
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          fi
