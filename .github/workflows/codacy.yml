name: Codacy analysis

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install the Codacy Analysis CLI
        run: |
          mkdir -p "$RUNNER_TEMP/codacy"
          cp .github/tools/codacy/package*.json "$RUNNER_TEMP/codacy/"
          npm ci --prefix "$RUNNER_TEMP/codacy" --ignore-scripts --no-audit --no-fund
          echo "$RUNNER_TEMP/codacy/node_modules/.bin" >> "$GITHUB_PATH"
      # .codacy/codacy.config.json pins the pattern set, so a change in the
      # CLI's automatic selection cannot change the gate unannounced. It is the
      # `codacy-analysis init --auto` selection with these changes:
      # - Dropped react-in-jsx-scope: the site uses the automatic JSX runtime.
      # - Dropped jsx-no-literals, jsx-max-depth, prefer-readonly-parameter-types,
      #   no-magic-numbers and the Tailwind no-arbitrary-value and
      #   no-custom-classname rules: style rules that do not fit an
      #   untranslated marketing site built on Tailwind theme tokens.
      # - Replaced PMD7, whose JavaScript parser fails on modern syntax, with
      #   the ESLint rules for its 4 patterns (eqeqeq, radix, consistent-return;
      #   no-with was already on).
      # - Added the Semgrep rules_lgpl JavaScript rules and PMD 6's
      #   InnaccurateNumericLiteral, which hosted Codacy runs, so this job
      #   catches what the pull request analysis does. Left out regex-dos:
      #   hosted Codacy does not run it and it times out on the large files.
      # Every security pattern stays on. Reviewed exceptions are inline, each
      # naming its rule and reason.
      - name: Analyse the repository
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          scope=()
          if [[ -n "$BASE_SHA" ]]; then
            scope=(--diff "$BASE_SHA")
          fi
          codacy-analysis analyze "${scope[@]}" --install-dependencies --output-format sarif --output "$RUNNER_TEMP/codacy.sarif"
      - name: Retain findings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codacy-sarif
          path: ${{ runner.temp }}/codacy.sarif
          if-no-files-found: error
