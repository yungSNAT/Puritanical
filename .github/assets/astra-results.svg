<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 202" role="img" aria-labelledby="title description" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="title">Correctness on GPT-6.2 Astra</title>
  <desc id="description">Each ruleset had 16 attempts. Puritanical passed 16, Chisle passed 15 and Ponytail passed 14.</desc>
  <style>
    .panel { fill: #fffff0; stroke: #9b7735 }
    text { fill: #000 }
    .track { fill: #e5e4e2 }
    .bar { fill: #66023c }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #000 } text { fill: #fffff0 }
      .track { fill: #3a3a3a } .bar { fill: #ffd32a }
    }
  </style>
  <rect class="panel" x="1" y="1" width="698" height="200" rx="9"/>
  <text x="24" y="37" font-size="22" font-weight="600">Passed attempts on GPT-6.2 Astra</text>
  <g font-size="17">
    <text x="24" y="84">Puritanical</text><text x="612" y="84">16 / 16</text>
    <text x="24" y="126">Chisle</text><text x="612" y="126">15 / 16</text>
    <text x="24" y="168">Ponytail</text><text x="612" y="168">14 / 16</text>
  </g>
  <g class="track">
    <rect x="137" y="66" width="448" height="23" rx="3"/>
    <rect x="137" y="108" width="448" height="23" rx="3"/>
    <rect x="137" y="150" width="448" height="23" rx="3"/>
  </g>
  <g class="bar">
    <rect x="137" y="66" width="448" height="23" rx="3"/>
    <rect x="137" y="108" width="420" height="23" rx="3"/>
    <rect x="137" y="150" width="392" height="23" rx="3"/>
  </g>
</svg>
