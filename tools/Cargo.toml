[package]
name = "puritanical-tools"
version = "1.0.0"
edition = "2024"
rust-version = "1.100"
description = "Maintainer tooling for Puritanical: generated rule copies, charts, README art and benchmark analysis."
license = "Apache-2.0 AND MIT"
repository = "https://github.com/yungSNAT/Puritanical"
publish = false

[dependencies]
puritanical-core = { path = "../core" }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
# prune: a Rust parser for each dead item's full extent, with byte offsets.
syn = { version = "3.0.10", default-features = false, features = ["full", "parsing", "printing", "visit"] }
proc-macro2 = { version = "1.0.107", default-features = false, features = ["span-locations"] }

[dev-dependencies]
tempfile = "3"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
ref_option = "warn"
# JavaScript numbers are doubles: the port casts counts to f64 and back as Node
# did, and every count stays far below 2^53.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
# The SVG layouts keep the JavaScript's short names (t, l, o, x, y, w, h, d).
many_single_char_names = "allow"
# `endsWith('.json')` is case-sensitive; the port keeps it so.
case_sensitive_file_extension_comparisons = "allow"
too_many_lines = "warn"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
